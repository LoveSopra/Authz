<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authz-demo: IAuthorizationService</title>
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --text:#1f2933; --muted:#6b7785; --border:#dde1e6;
    --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7;
    --bad:#b91c1c; --badbg:#fee2e2; --code:#0f172a; --codetext:#e2e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141a; --card:#1a222c; --text:#e6e9ee; --muted:#93a1b1; --border:#2b3644;
      --accent:#60a5fa; --ok:#4ade80; --okbg:#14361f; --warn:#fbbf24; --warnbg:#3a2c0b; --bad:#f87171; --badbg:#3d1414; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 0; }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:var(--muted); }
  main { padding:16px 24px 40px; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .login { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--card); color:var(--text);
    padding:6px 12px; border-radius:6px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.user.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .who { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { padding:2px 10px; border-radius:999px; font-size:13px; border:1px solid var(--border); }
  .chip.g { background:var(--okbg); color:var(--ok); border-color:transparent; }
  .chip.p { background:var(--warnbg); color:var(--warn); border-color:transparent; }
  .chip.r { background:var(--accent); color:#fff; border-color:transparent; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar .sp { flex:1; }
  .grid { display:grid; grid-template-columns:minmax(180px,1fr) 2fr; gap:10px 16px; align-items:start; }
  .head { font-weight:600; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  .row-title { font-weight:600; }
  .row-title small { display:block; font-weight:400; color:var(--muted); }
  .cell { border:1px solid var(--border); border-radius:8px; padding:8px; min-width:0; }
  .cell .top { display:flex; gap:8px; align-items:center; }
  .cell .url { font:12px ui-monospace,Consolas,monospace; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .result { margin-top:6px; padding:4px 8px; border-radius:6px; font-size:13px; display:none; }
  .result.show { display:block; }
  .result.s2 { background:var(--okbg); color:var(--ok); }
  .result.s401 { background:var(--warnbg); color:var(--warn); }
  .result.s403, .result.s404 { background:var(--badbg); color:var(--bad); }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { margin:6px 0 0; background:var(--code); color:var(--codetext); padding:10px; border-radius:8px;
    overflow:auto; font:12px/1.5 ui-monospace,Consolas,monospace; }
  .na { color:var(--muted); font-style:italic; }
  .na b { color:var(--bad); font-style:normal; }
  select { font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  .legend { color:var(--muted); font-size:13px; }
  @media (max-width:900px) { .grid { grid-template-columns:1fr; } .head { display:none; } }
</style>
</head>
<body>
<header>
  <h1>Autentisering &amp; auktorisering i ASP.NET Core</h1>
  <p>Auktorisering med <b>IAuthorizationService</b> – imperativt i koden.</p>
</header>
<main>

  <section class="card">
    <h2>1. Logga in <span class="legend">(lösenord för alla: <code>demo</code>)</span></h2>
    <div class="login">
      <span id="userButtons" class="login"></span>
      <button id="logout">Logga ut</button>
    </div>
    <div class="who" id="who"></div>
  </section>

  <section class="card">
    <h2>2. Testa behörigheter</h2>
    <div class="toolbar">
      <button class="primary" id="runAll">Kör alla</button>
      <label>Dokument-id för redigering:
        <select id="docId">
          <option value="1">1 – Budget 2026 (ägare: cecilia)</option>
          <option value="2">2 – Säljrapport Q3 (ägare: bosse)</option>
          <option value="3">3 – Styrelseprotokoll (ägare: anna)</option>
          <option value="4">4 – Kundavtal Norden (ägare: erik)</option>
        </select>
      </label>
      <span class="sp"></span>
      <span class="legend"><span class="chip g">2xx</span> ok &nbsp; <span class="chip p">401</span> ej inloggad &nbsp; <span class="chip" style="background:var(--badbg);color:var(--bad)">403</span> saknar behörighet</span>
    </div>

    <div class="grid" id="grid">
      <div class="head">Scenario</div>
      <div class="head">Med IAuthorizationService</div>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

const scenarios = [
  {
    title: 'Är inloggad', desc: 'Autentisering',
    authz: { method:'GET', url:'/authz/inloggad', code:
`authz.MapGet("/inloggad", (ClaimsPrincipal user) =>
    Results.Ok(...));` },
  },
  {
    title: 'Har rollen Admin', desc: 'Roll',
    authz: { method:'GET', url:'/authz/admin', code:
`authz.MapGet("/admin", (ClaimsPrincipal user) =>
    user.IsInRole("Admin")
        ? Results.Ok(...)
        : Results.Forbid());` },
  },
  {
    title: 'Med i gruppen Försäljning', desc: 'Grupp (claim "group")',
    authz: { method:'GET', url:'/authz/grupp/Forsaljning', code:
`authz.MapGet("/grupp/{namn}", async (string namn,
    ClaimsPrincipal user, IAuthorizationService authorization) =>
{
    var result = await authorization.AuthorizeAsync(
        user, null, new GroupRequirement(namn));
    return result.Succeeded ? Results.Ok(...) : Results.Forbid();
});` },
  },
  {
    title: 'Med i gruppen Ekonomi', desc: 'Dynamiskt gruppnamn',
    authz: { method:'GET', url:'/authz/grupp/Ekonomi', code:
`// Samma endpoint som ovan – gruppnamnet kommer från URL:en,
// en databas, en konfiguration eller vad som helst.
new GroupRequirement(namn)` },
  },
  {
    title: 'Läsa ett specifikt dokument', desc: 'Behörighet documents:read (jämför med redigering nedan)',
    authz: { method:'GET', url:'/authz/dokument/{id}', code:
`var doc = ...;
var result = await authorization.AuthorizeAsync(user, null,
    new PermissionRequirement(AppPermissions.DocumentsRead));
return result.Succeeded ? Results.Ok(...) : Results.Forbid();` },
  },
  {
    title: 'Har skrivrättighet', desc: 'Behörighet (claim "permission")',
    authz: { method:'PUT', url:'/authz/dokument', code:
`var result = await authorization.AuthorizeAsync(user, null,
    new PermissionRequirement(Permissions.DocumentsWrite));
return result.Succeeded ? Results.Ok(...) : Results.Forbid();` },
  },
  {
    title: 'Redigera ett specifikt dokument', desc: 'Resursbaserad: skrivrätt + (ägare eller Admin)',
    authz: { method:'PUT', url:'/authz/dokument/{id}', code:
`var doc = ...;   // hämta resursen först
var result = await authorization.AuthorizeAsync(
    user, doc, DocumentOperations.Edit);
return result.Succeeded ? Results.Ok(...) : Results.Forbid();

// Regeln bor i DocumentEditHandler och testas/återanvänds separat.` },
  },
];

const grid = $('#grid');
const cells = [];

scenarios.forEach((sc, i) => {
  const t = document.createElement('div');
  t.className = 'row-title';
  t.innerHTML = `${esc(sc.title)}<small>${esc(sc.desc)}</small>`;
  grid.appendChild(t);
  const def = sc.authz;
  const c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = `
    <div class="top"><button>${def.method}</button><span class="url"></span></div>
    <div class="result"></div>
    <details><summary>Visa kod</summary><pre>${esc(def.code)}</pre></details>`;
  const btn = c.querySelector('button');
  const urlEl = c.querySelector('.url');
  const resEl = c.querySelector('.result');
  const run = async () => {
    const url = def.url.replace('{id}', $('#docId').value);
    urlEl.textContent = url;
    const r = await fetch(url, { method: def.method });
    let body = {}; try { body = await r.json(); } catch {}
    const label = { 200:'OK', 401:'Unauthorized', 403:'Forbidden', 404:'Not found' }[r.status] || '';
    resEl.className = 'result show ' + (r.ok ? 's2' : 's' + r.status);
    resEl.textContent = `${r.status} ${label}` + (body.message ? ` – ${body.message}` : '');
  };
  btn.onclick = run;
  urlEl.textContent = def.url.replace('{id}', $('#docId').value);
  cells.push({ run, resEl, urlEl, def });
  grid.appendChild(c);
});

$('#docId').onchange = () => cells.forEach(c => { c.urlEl.textContent = c.def.url.replace('{id}', $('#docId').value); clear(c); });
const clear = c => { c.resEl.className = 'result'; c.resEl.textContent = ''; };
$('#runAll').onclick = async () => { for (const c of cells) await c.run(); };

// ---- Login ----
async function refreshMe() {
  const me = await (await fetch('/api/me')).json();
  const who = $('#who');
  document.querySelectorAll('button.user').forEach(b => b.classList.toggle('active', b.dataset.u === me.userName));
  if (!me.isAuthenticated) {
    who.innerHTML = '<span class="chip">Inte inloggad (anonym)</span>';
  } else {
    who.innerHTML = `<b>${esc(me.displayName)}</b> `
      + `<span class="chip r">Roll: ${esc(me.role)}</span>`
      + me.groups.map(g => `<span class="chip g">Grupp: ${esc(g)}</span>`).join('')
      + me.permissions.map(p => `<span class="chip p">${esc(p)}</span>`).join('')
      + (me.groups.length + me.permissions.length === 0 ? '<span class="chip">inga grupper/rättigheter</span>' : '');
  }
  cells.forEach(clear);
}

async function login(userName) {
  await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ userName, password: 'demo' }) });
  await refreshMe();
}

(async () => {
  const users = await (await fetch('/api/users')).json();
  const box = $('#userButtons');
  users.forEach(u => {
    const b = document.createElement('button');
    b.className = 'user'; b.dataset.u = u.userName; b.textContent = u.displayName;
    b.onclick = () => login(u.userName);
    box.appendChild(b);
  });
  $('#logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); await refreshMe(); };
  await refreshMe();
})();
</script>
</body>
</html>
